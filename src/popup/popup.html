<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defender Portal Flags</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <img src="../../assets/icon.svg" alt="Logo" width="24" height="24">
        <h1>Defender Flags</h1>
      </div>
      <div class="header-controls">
        <div id="status-indicator" class="status-badge">Checking...</div>
        <button id="theme-toggle" class="icon-button" title="Toggle Dark Mode">
          <svg class="moon-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="search-container">
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Filter flags..." class="search-input">
        <button id="clear-search-btn" class="clear-search-btn" title="Clear search" style="display: none;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <main>
      <div id="flags-list-container">
        <!-- Sections will be injected here by JS -->
        <div class="empty-state">Loading flags...</div>
      </div>
    </main>

    <footer>
      <div class="add-flag-container">
        <input type="text" id="new-flag-input" placeholder="Add new flag..." class="flag-input">
        <button id="add-flag-btn" class="secondary-button">Add</button>
      </div>
      <button id="action-button" class="primary-button" disabled>Loading...</button>
    </footer>
  </div>

  <div id="context-menu" class="context-menu" style="display: none;">
    <div class="context-menu-item" id="ctx-copy">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/></svg>
      <span>Copy Flag Name</span>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
